<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Payments — Local Market</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <div id="nav-root"></div>

  <div class="container admin-shell">
    <div id="admin-nav-root"></div>

    <main class="admin-main">
      <div class="admin-head">
        <div>
          <h1 id="admin-title">Payments</h1>
          <p class="muted" id="admin-subtitle">Mock payment records and refunds.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-outline btn-sm" id="refresh-btn">⟳ Refresh</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2 id="pay-count">Payments</h2>
          <div class="toolbar">
            <select class="select" id="status-filter" aria-label="Filter by payment status">
              <option value="">All statuses</option>
              <option value="PENDING">Pending</option>
              <option value="SUCCESS">Success</option>
              <option value="FAILED">Failed</option>
              <option value="REFUNDED">Refunded</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Payment</th>
                <th>Order</th>
                <th>Customer</th>
                <th>Amount</th>
                <th>Method</th>
                <th>Status</th>
                <th>Date</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="pay-body">
              <tr><td colspan="8" class="empty-cell">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div id="pay-pager"></div>
    </main>
  </div>

  <div id="footer-root"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/admin-payments.js"></script>
</body>
</html>
