<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search food and restaurants on Local Market.">
  <title>Search — Local Market</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="nav-root"></div>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Search</h1>
        <p class="muted" id="search-hint">Find dishes and restaurants across the marketplace.</p>
      </div>
    </div>

    <div class="toolbar" role="search">
      <div class="searchbox grow">
        <label class="sr-only" for="q">Search</label>
        <input type="search" id="q" placeholder="Try &quot;paneer&quot;, &quot;cake&quot;, &quot;curry&quot;..." autocomplete="off" autofocus>
        <button id="clear-btn" class="clear-btn" hidden aria-label="Clear search">✕</button>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Result type">
      <button class="tab on" role="tab" aria-selected="true" data-type="food">🍲 Dishes</button>
      <button class="tab" role="tab" aria-selected="false" data-type="restaurant">🏪 Restaurants</button>
    </div>

    <div class="rail" id="cat-filter" hidden aria-label="Category filter"></div>

    <div id="results-zone"></div>
    <div id="results-pager"></div>
  </main>

  <div id="footer-root"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
