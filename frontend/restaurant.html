<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Restaurant menu on Local Market.">
  <title>Restaurant — Local Market</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="nav-root"></div>

  <main class="container" id="page">
    <div id="rest-hero" class="rest-hero skeleton-hero" aria-hidden="true"></div>

    <div class="toolbar" role="search">
      <div class="searchbox">
        <input type="search" id="menu-q" placeholder="Search in this menu..." autocomplete="off" aria-label="Search in menu">
      </div>
      <label class="field-inline switch-line">
        <input type="checkbox" id="veg-only"> <span> Veg only</span>
      </label>
    </div>

    <div class="rail" id="menu-cats" aria-label="Menu categories"></div>

    <div id="foods-zone"></div>
  </main>

  <div id="footer-root"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/restaurant.js"></script>
</body>
</html>
