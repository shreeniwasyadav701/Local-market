<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your cart on Local Market.">
  <title>Cart — Local Market</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="nav-root"></div>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Your cart</h1>
        <p class="muted">Prices are always recalculated by the server.</p>
      </div>
      <div class="page-actions" id="cart-actions" hidden>
        <button class="btn btn-ghost btn-sm" id="clear-cart">🗑 Clear cart</button>
      </div>
    </div>

    <div class="checkout-grid" id="cart-layout">
      <div id="cart-items-zone"></div>
      <aside id="summary-zone" aria-label="Order summary"></aside>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
