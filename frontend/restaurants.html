<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse local restaurants on Local Market.">
  <title>Restaurants — Local Market</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="nav-root"></div>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Restaurants</h1>
        <p class="muted" id="rest-count">Loading local kitchens...</p>
      </div>
    </div>

    <div class="toolbar" role="search">
      <div class="searchbox">
        <input type="search" id="rest-q" placeholder="Search restaurants or cuisine..." autocomplete="off" aria-label="Search restaurants">
        <button id="rest-clear" class="clear-btn" hidden aria-label="Clear search">✕</button>
      </div>
      <label class="field-inline">
        <span class="sr-only">Sort by</span>
        <select id="rest-sort">
          <option value="rating_desc">Top rated</option>
          <option value="name_asc">Name (A–Z)</option>
          <option value="name_desc">Name (Z–A)</option>
          <option value="rating_asc">Rating (low to high)</option>
        </select>
      </label>
    </div>

    <div class="rail" id="rest-cats" hidden aria-label="Filter by cuisine"></div>

    <div id="restaurants-zone"></div>
    <div id="restaurants-pager"></div>
  </main>

  <div id="footer-root"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/restaurants.js"></script>
</body>
</html>
